<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Primer Añito 🍓</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Baloo 2', cursive;
            background:
                radial-gradient(circle at 10% 10%, rgba(255,255,255,.18) 0 8px, transparent 9px),
                radial-gradient(circle at 90% 30%, rgba(255,255,255,.15) 0 7px, transparent 8px),
                linear-gradient(135deg, #8d001f, #c2183a, #e52c51);

            color: white;
            overflow-x: hidden;
        }

        /* =========================
           SOBRE
        ========================= */

        #sobrePantalla {
            position: fixed;
            inset: 0;
            z-index: 9999;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle, #ef5471 1px, transparent 1px);
            background-size: 18px 18px;

            background-color: #8d001f;

            transition: opacity 1s ease;
        }

        .sobre-contenedor {
            text-align: center;
        }

        .sobre {
            width: 310px;
            height: 210px;

            position: relative;

            background: #fff4df;

            border-radius: 8px;

            box-shadow:
                0 20px 50px rgba(0,0,0,.35);

            cursor: pointer;

            animation: flotar 2.5s infinite ease-in-out;
        }

        .sobre::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            border-left: 155px solid transparent;
            border-right: 155px solid transparent;
            border-top: 115px solid #f7d9c4;

            z-index: 3;

            transform-origin: top;
            transition: 1s;
        }

        .sobre.abierto::before {
            transform: rotateX(180deg);
        }

        .sobre::after {
            content: "";

            position: absolute;

            bottom: 0;
            left: 0;

            border-left: 155px solid #eec7b4;
            border-top: 105px solid transparent;
            border-bottom: 105px solid transparent;
        }

        .sello {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 70px;
            height: 70px;

            border-radius: 50%;

            background: #c2183a;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 35px;

            z-index: 10;

            box-shadow: 0 5px 15px rgba(0,0,0,.25);
        }

        .texto-sobre {
            margin-top: 30px;

            font-size: 22px;
            font-weight: 700;

            animation: aparecer 2s infinite alternate;
        }

        @keyframes flotar {
            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes aparecer {
            from {
                opacity: .6;
            }

            to {
                opacity: 1;
            }
        }


        /* =========================
           INVITACIÓN
        ========================= */

        #invitacion {
            display: none;
            min-height: 100vh;

            animation: aparecerInvitacion 1.5s ease;
        }

        @keyframes aparecerInvitacion {
            from {
                opacity: 0;
                transform: scale(.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .seccion {
            min-height: 100vh;

            padding: 70px 20px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            position: relative;
        }


        /* =========================
           DECORACIONES
        ========================= */

        .fresa {
            position: absolute;

            width: 75px;

            opacity: .9;

            animation: flotar 4s infinite ease-in-out;

            pointer-events: none;
        }

        .fresa1 {
            top: 5%;
            left: 4%;
            transform: rotate(-20deg);
        }

        .fresa2 {
            top: 20%;
            right: 3%;
            transform: rotate(25deg);
        }

        .fresa3 {
            bottom: 8%;
            left: 5%;
            transform: rotate(15deg);
        }

        .fresa4 {
            bottom: 15%;
            right: 4%;
            transform: rotate(-25deg);
        }


        /* =========================
           PORTADA
        ========================= */

        .portada {
            background:
                linear-gradient(rgba(115,0,25,.25), rgba(115,0,25,.4));
        }

        .pequeno {
            font-size: 23px;
            letter-spacing: 2px;
        }

        .titulo {
            font-family: 'Playfair Display', serif;

            font-size: clamp(48px, 12vw, 90px);

            color: #fff;

            text-shadow:
                3px 4px 0 #85001e,
                0 5px 20px rgba(0,0,0,.3);

            margin: 10px 0;
        }

        .nombre {
            font-size: clamp(45px, 10vw, 75px);

            color: #ffd6dd;

            font-weight: 800;
        }

        .subtitulo {
            font-size: 25px;

            margin-top: 10px;
        }

        .personaje {
            width: 180px;
            max-width: 60%;

            margin: 25px auto;

            filter: drop-shadow(0 10px 10px rgba(0,0,0,.3));
        }

        .fecha {
            background: white;

            color: #b20d32;

            padding: 12px 28px;

            border-radius: 50px;

            font-size: 22px;
            font-weight: 700;

            box-shadow: 0 8px 20px rgba(0,0,0,.25);
        }


        /* =========================
           CARRUSEL
        ========================= */

        .titulo-seccion {
            font-family: 'Playfair Display', serif;

            font-size: 42px;

            margin-bottom: 25px;
        }

        .carrusel {
            width: min(900px, 95%);

            position: relative;

            overflow: hidden;

            border-radius: 25px;

            border: 7px solid rgba(255,255,255,.7);

            box-shadow:
                0 15px 40px rgba(0,0,0,.35);
        }

        .imagenes {
            display: flex;

            transition: transform .6s ease;
        }

        .imagenes img {
            width: 100%;

            flex-shrink: 0;

            height: 480px;

            object-fit: cover;
        }

        .boton-carrusel {
            position: absolute;

            top: 50%;

            transform: translateY(-50%);

            width: 50px;
            height: 50px;

            border: none;

            border-radius: 50%;

            background: white;

            color: #c2183a;

            font-size: 30px;

            cursor: pointer;

            box-shadow: 0 5px 15px rgba(0,0,0,.3);
        }

        .anterior {
            left: 15px;
        }

        .siguiente {
            right: 15px;
        }


        /* =========================
           INFORMACIÓN
        ========================= */

        .tarjeta {
            background: rgba(255,255,255,.95);

            color: #85001e;

            width: min(600px, 95%);

            padding: 35px;

            border-radius: 30px;

            box-shadow: 0 15px 40px rgba(0,0,0,.3);

            margin: 15px;
        }

        .tarjeta h3 {
            font-size: 30px;

            margin-bottom: 10px;
        }

        .tarjeta p {
            font-size: 20px;

            margin: 10px 0;
        }


        /* =========================
           BOTONES
        ========================= */

        .boton {
            display: inline-block;

            margin-top: 20px;

            padding: 14px 28px;

            background: #c2183a;

            color: white;

            text-decoration: none;

            border-radius: 50px;

            font-size: 20px;

            font-weight: 700;

            transition: .3s;

            box-shadow: 0 7px 15px rgba(0,0,0,.25);
        }

        .boton:hover {
            transform: translateY(-4px);

            background: #970027;
        }

        .boton-fotos {
            background: #ffb6c4;

            color: #85001e;
        }


        /* =========================
           MUSICA
        ========================= */

        .musica {
            position: fixed;

            bottom: 20px;
            right: 20px;

            z-index: 1000;

            width: 55px;
            height: 55px;

            border: none;

            border-radius: 50%;

            background: white;

            color: #c2183a;

            font-size: 24px;

            cursor: pointer;

            box-shadow: 0 5px 15px rgba(0,0,0,.3);
        }


        /* =========================
           FINAL
        ========================= */

        .final {
            min-height: 70vh;

            background: #78001b;
        }

        .corazon {
            font-size: 55px;

            animation: latido 1.3s infinite;
        }

        @keyframes latido {
            0%,100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width:600px) {

            .sobre {
                width: 280px;
                height: 190px;
            }

            .sobre::before {
                border-left-width: 140px;
                border-right-width: 140px;
            }

            .imagenes img {
                height: 360px;
            }

            .titulo-seccion {
                font-size: 34px;
            }

            .tarjeta {
                padding: 25px 18px;
            }

        }

    </style>
</head>


<body>
